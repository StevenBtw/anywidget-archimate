[project]
name = "anywidget-archimate"
version = "0.4.0"
description = "Interactive ArchiMate model viewer widget for Jupyter, Marimo, and VS Code notebooks"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "S.T. Grond", email = "dev@grafeo.dev" }]
keywords = ["anywidget", "archimate", "enterprise-architecture", "visualization", "widget"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["anywidget>=0.9.21"]

[project.optional-dependencies]
# marimo needs loro, which has no Python 3.15 wheels yet; drop the marker once it does
examples = ["marimo>=0.20.4; python_version < '3.15'"]

[project.urls]
Homepage = "https://github.com/StevenBtw/anywidget-archimate"
Repository = "https://github.com/StevenBtw/anywidget-archimate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anywidget_archimate"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]
